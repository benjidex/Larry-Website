<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Larry Lar Studios</title>
    <style>
      :root {
        --bg: #0f0f10;
        --panel: #17181b;
        --panel-alt: #1f2024;
        --text: #f2f2f2;
        --muted: #b8b8b8;
        --line: rgba(255,255,255,0.08);
        --accent: #d4af37;
        --danger: #dc2626;
        --success: #22c55e;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }

      h1, h2, h3 { margin-top: 0; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      input, select, button {
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 12px 14px;
        font-size: 15px;
      }

      input, select {
        background: var(--panel-alt);
        color: var(--text);
      }

      button {
        cursor: pointer;
        background: var(--accent);
        color: #111;
        border: none;
        font-weight: 700;
        transition: opacity .2s ease;
      }

      button:hover { opacity: 0.9; }

      .danger {
        background: var(--danger);
        color: white;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .image-card {
        background: var(--panel-alt);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      .image-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }

      .image-info {
        padding: 12px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }

      #status {
        color: var(--muted);
        min-height: 24px;
      }

      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h1>Admin Dashboard</h1>
        <button id="logoutBtn" class="danger">Log out</button>
      </div>

      <section class="card">
        <h2>Add Gallery Image</h2>
        <form id="uploadForm">
          <label>
            Title
            <input type="text" name="title" placeholder="Wedding portrait" required />
          </label>
          <label>
            Category
            <select name="category" required>
              <option value="wedding">Wedding</option>
              <option value="maternity">Maternity</option>
              <option value="graduation">Graduation</option>
              <option value="family">Family</option>
              <option value="fashion">Fashion</option>
              <option value="portrait">Portrait</option>
            </select>
          </label>
          <label>
            Upload image
            <input type="file" name="image" accept="image/*" required />
          </label>
          <button type="submit">Upload image</button>
          <div id="status"></div>
        </form>
      </section>

      <section class="card">
        <h2>Current gallery</h2>
        <div id="galleryList" class="grid"></div>
      </section>
    </div>

  </body>
</html>
