<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Larry Lar Studios</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f0f10;
        color: #f5f5f5;
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(460px, 92vw);
        background: #17181b;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 32px;
      }
      h1 { margin-top: 0; }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        color: #cfcfcf;
      }
      input, button {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 12px 14px;
        font-size: 15px;
      }
      input {
        background: #1f2024;
        color: white;
      }
      button {
        background: #d4af37;
        border: none;
        color: #111;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        min-height: 24px;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Login</h1>
      <form id="loginForm" method="post" novalidate>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" inputmode="email" maxlength="254" required />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" maxlength="128" required />
        </label>
        <button type="submit">Log in</button>
        <div id="status" aria-live="polite"></div>
      </form>
      <p style="margin: 18px 0 0; text-align: center;">
        <a href="admin.html" style="color: #d4af37; text-decoration: none;">Open admin dashboard</a>
      </p>
    </div>

    <script>
      window.__APP_CONFIG__ = { supabaseUrl: '', supabaseAnonKey: '', storageBucket: 'portfolio-images', adminEmails: [] };
      async function loadAppConfig() {
        try {
          const response = await fetch('/api/config');
          if (!response.ok) return;
          const config = await response.json();
          window.__APP_CONFIG__ = {
            supabaseUrl: config.supabaseUrl || '',
            supabaseAnonKey: config.supabaseAnonKey || '',
            storageBucket: config.storageBucket || 'portfolio-images',
            adminEmails: Array.isArray(config.adminEmails) ? config.adminEmails : []
          };
        } catch (error) {
          console.warn('App config could not be loaded from the server.', error);
        }
      }
      loadAppConfig();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const allowedAdminEmails = () => {
        const list = Array.isArray(window.__APP_CONFIG__?.adminEmails) ? window.__APP_CONFIG__.adminEmails : [];
        return list.map((email) => email.trim().toLowerCase()).filter(Boolean);
      };

      const supabase = window.supabase.createClient(window.__APP_CONFIG__?.supabaseUrl || '', window.__APP_CONFIG__?.supabaseAnonKey || '', {
        auth: { persistSession: true }
      });

      const form = document.getElementById('loginForm');
      const status = document.getElementById('status');

      const urlParams = new URLSearchParams(window.location.search);
      const errorParam = urlParams.get('error');
      if (errorParam === 'not-authorized') {
        status.textContent = 'This account is not authorized for admin access.';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = form.email.value.trim().toLowerCase();
        const password = form.password.value;

        if (!email || !password) {
          form.password.value = '';
          status.textContent = 'Please enter your email and password.';
          return;
        }

        await loadAppConfig();

        const finalAllowedEmails = allowedAdminEmails();
        const client = window.supabase.createClient(window.__APP_CONFIG__?.supabaseUrl || '', window.__APP_CONFIG__?.supabaseAnonKey || '', {
          auth: { persistSession: true }
        });

        try {
          status.textContent = 'Signing in...';
          const { data, error } = await client.auth.signInWithPassword({ email, password });

          if (error) throw error;

          const signedInEmail = data.user?.email?.trim().toLowerCase();
          if (!signedInEmail || !finalAllowedEmails.includes(signedInEmail)) {
            form.password.value = '';
            await client.auth.signOut();
            throw new Error('This email is not authorized for admin access.');
          }

          form.password.value = '';
          window.location.href = 'admin.html';
        } catch (error) {
          form.password.value = '';
          status.textContent = error.message || 'Login failed.';
        }
      });
    </script>
  </body>
</html>
